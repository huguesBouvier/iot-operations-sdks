name: SDK file-watcher validation

on:
  push:
    branches:
      - users/hubouvie/s360-notify-hosted-validation-v1

permissions:
  contents: read

defaults:
  run:
    shell: bash
    working-directory: rust

jobs:
  validation:
    name: Validate fixed SDK graph on pinned Rust
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: huguesBouvier/iot-operations-sdks
          ref: b8453eb6a2fc7c84b31fda63b74a3e0924fd6010
          persist-credentials: false

      - name: Setup repository-pinned Rust
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30
        with:
          rust-src-dir: rust
          cache: false
          rustflags: ''
          build-warnings: ''

      - name: Install existing system dependencies
        run: bash ./scripts/system-deps.sh

      - name: Install existing cargo tooling
        uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2
        with:
          tool: cargo-machete,cargo-hack

      - name: Run existing SDK checks
        run: make check

      - name: Run existing SDK tests without broker access
        run: env -u ENABLE_NETWORK_TESTS make test

      - name: Verify exact source and obsolete dependency removal
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = b8453eb6a2fc7c84b31fda63b74a3e0924fd6010
          cargo metadata --format-version 1 > "$RUNNER_TEMP/sdk-dependencies.json"
          python3 - "$RUNNER_TEMP/sdk-dependencies.json" <<'PY'
          import json
          import sys
          with open(sys.argv[1]) as stream:
              packages = json.load(stream)["packages"]
          assert not any(package["name"] == "instant" for package in packages)
          print(json.dumps({
              "instantRemoved": True,
              "notify": [p["version"] for p in packages if p["name"] == "notify"],
              "debouncer": [p["version"] for p in packages if p["name"] == "notify-debouncer-full"],
              "sourceVersion": "b8453eb6a2fc7c84b31fda63b74a3e0924fd6010",
          }))
          PY
